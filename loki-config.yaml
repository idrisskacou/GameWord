auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m       # Any chunk not receiving new logs in this time is flushed
  chunk_retain_period: 30s     # Any chunk that has been flushed but not read in this time is removed

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # Reject logs older than 7 days

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h  # Retain logs for 7 days

compactor:
  working_directory: /loki/compactor


