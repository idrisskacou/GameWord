# Global settings
global:
  scrape_interval: 15s  # How often to scrape targets (e.g., every 15 seconds)
  evaluation_interval: 15s  # How often to evaluate rules

# Scrape configurations
scrape_configs:
  # Scraping the Angular app (if it exposes metrics via Prometheus format)
  - job_name: 'angular-frontend'
    static_configs:
      - targets: ['localhost:4200']

  # Scraping the Express backend
  - job_name: 'express-backend'
    static_configs:
      - targets: ['localhost:3000']

    # Scraping rabbitmq
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']


  # Scraping Prometheus itself (optional)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Prometheus to Scrape cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']


  # Scraping other services like Grafana, Loki, etc., can be added similarly
